<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindflow</title>
    <link rel="shortcut icon" href="img/Network.svg" type="image/x-icon">
    <link rel="stylesheet" href="GeneralStyle.css">
    <link rel="stylesheet" href="Mindflow.css">
</head>
<body data-page="editor">
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="Mindflow.html">
                <img class="logo-dark" src="img/Mindflow (white).svg" alt="">
                <img class="logo-light" src="img/Mindflow.svg" alt="">
                <span>Mindflow</span>
            </a>
            <nav class="navigation" aria-label="Main navigation">
                <a class="Links active" href="Mindflow.html" aria-current="page"><span class="nav-icon">✎</span> Editor</a>
                <a class="Links" href="storage.html"><span class="nav-icon">▤</span> Storage</a>
                <a class="Links" href="charts.html"><span class="nav-icon">⌘</span> Charts</a>
                <a class="Links" href="settings.html"><span class="nav-icon">⚙</span> Settings</a>
            </nav>
        </aside>

        <main class="main-window">
            <header class="page-header editor-header">
                <div class="document-location">
                    <div class="location-item">
                        <span class="eyebrow">WORKSPACE</span>
                        <a id="BoxName" class="location-link" href="storage.html" title="Browse workspace folders">Choose a workspace</a>
                    </div>
                    <span class="location-divider">/</span>
                    <div class="location-item">
                        <span class="eyebrow">NOTE</span>
                        <div class="document-actions">
                            <button id="OpenNote" class="location-link" type="button" aria-label="Open a different note"><span id="DocumentName">Open a note</span></button>
                            <button id="RenameNote" class="tree-rename" type="button" disabled>Rename</button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="editor-panel">
                <div class="editor-toolbar">
                    <p id="NoteStatus" class="status-text" role="status" aria-live="polite"></p>
                    <div class="button-row">
                        <button id="SaveNote" type="button" disabled>Save</button>
                        <button id="DeleteNote" class="button button-danger" type="button" disabled>Clear</button>
                    </div>
                </div>
                <div class="editor-content">
                    <div class="note-editor">
                        <pre id="NoteHighlight" class="note-highlight" aria-hidden="true"></pre>
                        <textarea id="NoteText" class="note-text" aria-label="Document text" placeholder="Write a note..."></textarea>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js" defer></script>
</body>
</html>
