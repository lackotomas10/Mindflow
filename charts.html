<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charts — Mindflow</title>
    <link rel="shortcut icon" href="img/Network.svg" type="image/x-icon">
    <link rel="stylesheet" href="GeneralStyle.css">
    <link rel="stylesheet" href="Workspace.css">
</head>
<body data-page="charts">
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="Mindflow.html"><img class="logo-dark" src="img/Mindflow (white).svg" alt=""><img class="logo-light" src="img/Mindflow.svg" alt=""><span>Mindflow</span></a>
            <nav class="navigation" aria-label="Main navigation">
                <a class="Links" href="Mindflow.html"><span class="nav-icon">✎</span> Editor</a>
                <a class="Links" href="storage.html"><span class="nav-icon">▤</span> Storage</a>
                <a class="Links active" href="charts.html" aria-current="page"><span class="nav-icon">⌘</span> Charts</a>
                <a class="Links" href="settings.html"><span class="nav-icon">⚙</span> Settings</a>
            </nav>
        </aside>

        <main class="main-window workspace-layout">
            <header class="page-header">
                <div>
                    <h1>Charts</h1>
                    <p class="page-description">Explore the connections between your notes.</p>
                </div>
                <div class="button-row">
                    <button id="AnimateGraph" class="button button-secondary" type="button" disabled>Animation</button>
                    <button id="RefreshGraph" class="button button-secondary" type="button">Refresh graph</button>
                    <button id="ChooseGraphFolder" type="button">Choose workspace</button>
                </div>
            </header>

            <section class="graph-panel">
                <div class="graph-heading">
                    <div>
                        <h2>Note connections</h2>
                        <p id="GraphStatus" class="status-text" role="status" aria-live="polite">Choose a workspace folder to build your graph.</p>
                    </div>
                    <span class="graph-legend"><i></i> Markdown note</span>
                </div>
                <div class="graph-canvas">
                    <svg id="GraphCanvas" viewBox="0 0 1000 680" role="img" aria-label="Graph of linked Markdown notes"></svg>
                </div>
                <p class="graph-hint">Link notes with <code>[[Note name]]</code> or standard Markdown links.</p>
            </section>
        </main>
    </div>
    <script src="app.js" defer></script>
</body>
</html>
